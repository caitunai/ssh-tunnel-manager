name: Cross-platform shell tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Runtime versions
        run: |
          /bin/bash --version
          ssh -V
      - name: Syntax check and offline smoke tests
        run: |
          /bin/bash -n tunnel
          /bin/bash tests/smoke.sh
